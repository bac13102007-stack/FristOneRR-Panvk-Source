name: Build PanVK for G710
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get my source code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang llvm-dev libclang-dev libclang-cpp-dev libelf-dev zlib1g-dev libzstd-dev pkg-config cmake python3-pip spirv-tools
          pip3 install --break-system-packages mako pyyaml

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "$PWD/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build host shader compiler (mesa_clc)
        run: |
          meson setup build-host \
            -Dvulkan-drivers=panfrost -Dgallium-drivers= -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dopengl=false \
            -Dbuildtype=release
          ninja -C build-host mesa_clc || ninja -C build-host src/util/mesa_clc
          find build-host -name mesa_clc -type f

      - name: Prepare cross file for cloud machine
        run: |
          CLC=$(find "$PWD/build-host" -name mesa_clc -type f | head -n 1)
          cat > ci-cross.txt <<EOF
          [binaries]
          c = ['clang', '--target=aarch64-linux-android35']
          cpp = ['clang++', '--target=aarch64-linux-android35']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'
          mesa_clc = '$CLC'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          [built-in options]
          [properties]
          platform-sdk-version = '35'
          EOF

      - name: Build the driver (tuned for Dimensity 9000+)
        run: |
          OPTS=$(grep -v -- '-Dprecomp-compiler' tools/fristonerr/build-options.txt)
          meson setup build-android --cross-file ci-cross.txt $OPTS \
            --buildtype=release \
            -Dc_args=-mcpu=cortex-a710 -Dcpp_args=-mcpu=cortex-a710
          ninja -C build-android

      - name: Save my driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-g710-mybuild
          path: build-android/src/panfrost/vulkan/libvulkan_panfrost.so
